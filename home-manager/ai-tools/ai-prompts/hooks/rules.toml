version = 1

# Claude Code and Codex both use the claude-code event format for this hook.
# File covers Read|Write|Edit; Bash covers shell commands, including aitools.
# Grep, Glob, MultiEdit, and NotebookEdit are not canonical tools in this guard version.
# Their path fields cannot be configured here; FR-017 must restrict those tools.
# Runtime registration must treat hook errors as blocking failures.
#
# These regex rules inspect literal paths, not filesystem identities or shell expansion.
# Variable-built paths, symlink aliases, and recursive reads of a parent directory require
# runtime/tool enforcement. Mentions of protected paths in shell strings also block.

[[rules]]
matcher = "File"
# Rust regex has no lookaround or allow rules. The suffix expression is the complement of
# exactly example/sample/template: proper prefixes, first mismatches, or longer words.
regex = '(?i)\.env$|(?:^|/)\.env(?:\.(?:|e|ex|exa|exam|examp|exampl|s|sa|sam|samp|sampl|t|te|tem|temp|templ|templa|templat|[^est/][^/]*|e[^x/][^/]*|ex[^a/][^/]*|exa[^m/][^/]*|exam[^p/][^/]*|examp[^l/][^/]*|exampl[^e/][^/]*|example[^/]+|s[^a/][^/]*|sa[^m/][^/]*|sam[^p/][^/]*|samp[^l/][^/]*|sampl[^e/][^/]*|sample[^/]+|t[^e/][^/]*|te[^m/][^/]*|tem[^p/][^/]*|temp[^l/][^/]*|templ[^a/][^/]*|templa[^t/][^/]*|templat[^e/][^/]*|template[^/]+)|rc)$'
message = "Environment files are off-limits. Continue without them; use the variables named in the task or in checked-in documentation."

[[rules]]
matcher = "File"
regex = '(?i)(?:^|/)\.(?:ssh|gnupg)(?:/|$)|(?:^|/)\.config/gh/hosts\.yml$|(?:^|/)\.docker/config\.json$|(?:^|/)\.kube/config$'
message = "Credential files and SSH/GnuPG directories are off-limits. Continue without reading or changing them."

# Keychains, Codex auth and shell snapshots (snapshots capture exported tokens), gcloud, and Terraform.
[[rules]]
matcher = "File"
regex = '(?i)(?:^|/)Library/Keychains(?:/|$)|(?:^|/)\.config/codex/auth\.json$|(?:^|/)\.codex/auth\.json$|(?:^|/)\.config/codex/shell_snapshots(?:/|$)|(?:^|/)\.config/gcloud(?:/|$)|(?:^|/)\.terraform\.d/credentials\.tfrc\.json$'
message = "Keychains and CLI credential stores are off-limits. Continue without reading or changing them."

# Match paths anywhere in shell text to cover wrappers, redirections, and aitools options.
[[rules]]
matcher = "Bash"
regex = '''(?ix)
    (?:^|[\s/'"=<>:])[^\s/'";|&()<>`]*\.env(?:$|[\s'";|&)<>`])
  | (?:^|[\s/'"=<>:])\.env(?:\.(?:|e|ex|exa|exam|examp|exampl|s|sa|sam|samp|sampl|t|te|tem|temp|templ|templa|templat|[^est\s/'";|&)<>`][^\s/'";|&)<>`]*|e[^x\s/'";|&)<>`][^\s/'";|&)<>`]*|ex[^a\s/'";|&)<>`][^\s/'";|&)<>`]*|exa[^m\s/'";|&)<>`][^\s/'";|&)<>`]*|exam[^p\s/'";|&)<>`][^\s/'";|&)<>`]*|examp[^l\s/'";|&)<>`][^\s/'";|&)<>`]*|exampl[^e\s/'";|&)<>`][^\s/'";|&)<>`]*|example[^\s/'";|&)<>`]+|s[^a\s/'";|&)<>`][^\s/'";|&)<>`]*|sa[^m\s/'";|&)<>`][^\s/'";|&)<>`]*|sam[^p\s/'";|&)<>`][^\s/'";|&)<>`]*|samp[^l\s/'";|&)<>`][^\s/'";|&)<>`]*|sampl[^e\s/'";|&)<>`][^\s/'";|&)<>`]*|sample[^\s/'";|&)<>`]+|t[^e\s/'";|&)<>`][^\s/'";|&)<>`]*|te[^m\s/'";|&)<>`][^\s/'";|&)<>`]*|tem[^p\s/'";|&)<>`][^\s/'";|&)<>`]*|temp[^l\s/'";|&)<>`][^\s/'";|&)<>`]*|templ[^a\s/'";|&)<>`][^\s/'";|&)<>`]*|templa[^t\s/'";|&)<>`][^\s/'";|&)<>`]*|templat[^e\s/'";|&)<>`][^\s/'";|&)<>`]*|template[^\s/'";|&)<>`]+)|rc)(?:$|[\s'";|&)<>`])
  | (?:^|[\s/'"=<>:])\.(?:ssh|gnupg|aws)(?:$|[\s/'";|&)<>`])
  | (?:^|[\s/'"=<>:])\.config/gh/hosts\.yml(?:$|[\s/'";|&)<>`])
  | (?:^|[\s/'"=<>:])\.docker/config\.json(?:$|[\s/'";|&)<>`])
  | (?:^|[\s/'"=<>:])\.kube/config(?:$|[\s/'";|&)<>`])
  | (?:^|[\s/'"=<>:])Library/Keychains(?:$|[\s/'";|&)<>`])
  | (?:^|[\s/'"=<>:])\.config/codex/(?:auth\.json|shell_snapshots)(?:$|[\s/'";|&)<>`])
  | (?:^|[\s/'"=<>:])\.codex/auth\.json(?:$|[\s/'";|&)<>`])
  | (?:^|[\s/'"=<>:])\.config/gcloud(?:$|[\s/'";|&)<>`])
  | (?:^|[\s/'"=<>:])\.terraform\.d/credentials\.tfrc\.json(?:$|[\s/'";|&)<>`])
  | \.(?:git-credentials|netrc|npmrc)(?:$|[\s/'";|&)<>`])
  | /id_[a-z0-9_]+(?:$|[\s'";|&)<>`])
  | (?:^|[\s/'"=<>:])id_(?:rsa|dsa|ecdsa|ed25519|ecdsa_sk|ed25519_sk)(?:$|[\s'";|&)<>`])
'''
message = "This command names a protected credential path. Continue without reading or changing it; use documented variable names instead."
[[rules]]
matcher = "File"
regex = '(?i)\.aws/'
message = "AWS credentials are off-limits. Continue without them; use the configuration named in the task."

[[rules]]
matcher = "File"
regex = '(?i)(^|/)id_[A-Za-z0-9_]+$'
message = "Private keys are off-limits. Continue without them."

[[rules]]
matcher = "File"
regex = '(?i)\.git-credentials$|\.netrc$|\.npmrc$'
message = "Credential files are off-limits. Continue without them."

# git runs what these files name: a planted remote.<name>.uploadpack or core.fsmonitor in config runs
# on the next `git fetch` or `git status`, and a hook runs on the next git command. Covers `.git/` and
# the bare-repo form `<name>.git/`, and submodule git directories under `.git/modules/`.
[[rules]]
matcher = "Write|Edit"
regex = '\.git/(config|hooks/|modules/.+/(config|hooks/))'
message = "Git config and hooks are off-limits to writes: a planted setting runs a program on the next git fetch. Continue without editing them; ask the user to make the change."

# Claude Code cannot express `rm -rf /*` as a permission pattern without also matching `rm -rf /tmp/x`
# (see bashDenyPatterns in home-manager/ai-tools/shared/default.nix), so the literal targets are matched
# here. A target must be a whole word, so a deeper path (`/tmp/x`, `$HOME/work/x`) passes. The command
# text is matched as written: `rm -rf "$d"` and `echo "rm -rf /"` are outside what a regex can judge.
[[rules]]
matcher = "Bash"
regex = '''(?:^|[\s;&|(`/])rm(?:\s+[^\s;&|]+)*?\s+["']?(?:/+(?:\*|\.\*)?|/(?:Users|home|Volumes|cores|srv|mnt|media|var|private|private/var)/?\*?|~/?(?:\*|\.\*)?|\$\{?HOME\}?/?(?:\*|\.\*)?)["']?\*?(?:\s|$|[;&|)])'''
message = "rm on /, a home directory, or a top-level system directory is off-limits. Continue by naming the specific files or directories to remove."
