name: cache
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: X13Gen2
            runner: ubuntu-latest
            attr: nixosConfigurations.X13Gen2.config.system.build.toplevel
          - host: M4-Max
            runner: macos-latest
            attr: darwinConfigurations.M4-Max.system
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Setup nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # cachix-action pushes every path this builds, so the hosts download the closure instead of building it.
      # --keep-going still builds and pushes the rest when one source download fails.
      # A download that drops at its last byte is resumed past the end of the file, answered with 416, and
      # disables that cache for the rest of the invocation. A new invocation has every cache again and
      # only redoes what is still missing.
      - name: Build ${{ matrix.host }}
        run: |
          for attempt in 1 2 3; do
            nix build --no-link --print-build-logs --keep-going ".#${{ matrix.attr }}" && exit 0
            echo "::warning::nix build attempt ${attempt} failed"
          done
          exit 1
