name: Run setup-nix
description: Set up Nix environment for GitHub Actions
inputs:
  cachix-auth-token:
    required: true
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v14
      with:
        name: takeokunn-nixos-configuration
        authToken: "${{ inputs.cachix-auth-token }}"
        # Unfree packages must not be redistributed from the public cache. Add each new one here.
        pushFilter: "(slack|discord|google-chrome)"
