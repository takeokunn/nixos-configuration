name: Run setup-nix
description: Set up Nix environment for GitHub Actions
inputs:
  cachix-auth-token:
    required: true
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v14
      with:
        name: takeokunn-nixos-configuration
        authToken: "${{ inputs.cachix-auth-token }}"
        # Unfree packages must not be redistributed from the public cache. Add each new one here.
        pushFilter: "(slack|discord|google-chrome)"
    # A runner knows only cache.nixos.org and the project cache. Without the hosts' other caches it
    # fetches the Emacs source from Savannah and compiles codex, both of which a host substitutes.
    - name: Use the hosts' binary caches
      shell: bash
      run: |
        mkdir -p ~/.config/nix
        nix eval --raw --file shared/nix-caches.nix --apply 'c: "extra-substituters = ${toString c.substituters}\nextra-trusted-public-keys = ${toString c.trusted-public-keys}\nfallback = ${if c.settings.fallback then "true" else "false"}\n"' >> ~/.config/nix/nix.conf
